<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Fonte da imagem de compartilhamento img/compartilhar.png (1200x630). Para regerar, abra num navegador em 1200x630 e tire um screenshot.
     O favicon (img/favicon.svg) é desenhado à mão; os PNGs de 32 e 180 px são renderizações dele. -->
<title>Imagem de compartilhamento</title>
<style>
  @font-face { font-family: "Bricolage Grotesque"; font-weight: 600 800; src: url("../fonts/bricolage-grotesque-latin.woff2") format("woff2"); }
  @font-face { font-family: "Source Sans 3"; font-weight: 400 700; src: url("../fonts/source-sans-3-latin.woff2") format("woff2"); }
  :root { --bg: #f6f5f1; --surface: #ffffff; --ink: #1d1f24; --muted: #5d6270; --line: #e2e0d8; --accent: #0b6e4f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: var(--bg); color: var(--ink); font-family: "Source Sans 3", sans-serif;
    padding: 60px 80px 64px; display: flex; flex-direction: column; justify-content: space-between; }
  .kicker { text-transform: uppercase; letter-spacing: .1em; font-size: 24px; font-weight: 700; color: var(--accent); margin: 0; }
  h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 96px; line-height: .98; letter-spacing: -.035em; margin: 18px 0 0; }
  .lead { font-size: 32px; line-height: 1.3; color: var(--muted); margin: 22px 0 0; max-width: 1040px; }
  .barra { display: flex; gap: 6px; height: 56px; border-radius: 14px; overflow: hidden; }
  .barra span { display: block; }
  .rodape { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; font-size: 26px; color: var(--muted); }
  .rodape .fonte { display: flex; flex-direction: column; gap: 2px; }
  .rodape strong { color: var(--ink); font-weight: 700; }
  .cta { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -.01em;
    background: var(--accent); color: #ffffff; padding: 16px 30px 18px; border-radius: 14px; }
</style>
</head>
<body>
  <div>
    <p class="kicker">Deputados e vereadores · eleições de 2020 a 2026</p>
    <h1>Para onde foi o seu voto?</h1>
    <p class="lead">Veja quais deputados o seu voto ajudou a eleger, e em que proporção.</p>
  </div>
  <div>
    <div class="barra" aria-hidden="true">
      <span style="flex:46;background:hsl(160 55% 45%)"></span>
      <span style="flex:24;background:hsl(213 55% 45%)"></span>
      <span style="flex:15;background:hsl(266 55% 45%)"></span>
      <span style="flex:10;background:hsl(319 55% 45%)"></span>
      <span style="flex:5;background:hsl(12 55% 45%)"></span>
    </div>
    <div class="rodape"><span class="fonte"><strong>chicocvenancio.github.io</strong><span>Dados oficiais do TSE · sistema proporcional</span></span><span class="cta">Consulte o seu voto →</span></div>
  </div>
</body>
</html>
