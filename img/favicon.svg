<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Urna eletrônica</title>
  <!-- corpo -->
  <rect x="1" y="4" width="62" height="56" rx="9" fill="#0b6e4f"/>
  <!-- tela -->
  <rect x="7" y="10" width="26" height="31" rx="3" fill="#e3f1ea"/>
  <rect x="11" y="16" width="14" height="4" rx="2" fill="#0b6e4f" opacity=".55"/>
  <rect x="11" y="24" width="18" height="4" rx="2" fill="#0b6e4f" opacity=".55"/>
  <!-- teclado numérico (1–9 e 0) -->
  <g fill="#ffffff">
    <rect x="37" y="10" width="6" height="6" rx="1.2"/><rect x="45" y="10" width="6" height="6" rx="1.2"/><rect x="53" y="10" width="6" height="6" rx="1.2"/>
    <rect x="37" y="18" width="6" height="6" rx="1.2"/><rect x="45" y="18" width="6" height="6" rx="1.2"/><rect x="53" y="18" width="6" height="6" rx="1.2"/>
    <rect x="37" y="26" width="6" height="6" rx="1.2"/><rect x="45" y="26" width="6" height="6" rx="1.2"/><rect x="53" y="26" width="6" height="6" rx="1.2"/>
    <rect x="45" y="34" width="6" height="6" rx="1.2"/>
  </g>
  <!-- BRANCO, CORRIGE, CONFIRMA -->
  <rect x="7" y="46" width="15" height="8" rx="2" fill="#ffffff"/>
  <rect x="24.5" y="46" width="15" height="8" rx="2" fill="#f08a24"/>
  <rect x="42" y="46" width="17" height="8" rx="2" fill="#7fe0b5"/>
</svg>
